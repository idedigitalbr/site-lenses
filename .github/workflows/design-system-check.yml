name: Validar Design System
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-design-system.mjs
