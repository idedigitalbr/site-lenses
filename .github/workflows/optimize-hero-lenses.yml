name: One-time Lenses hero optimization
on:
  push:
    branches: [fix/lenses-hero-bellamazon-scroll-20261109]
    paths: ['.github/workflows/optimize-hero-lenses.yml']
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Encode web-ready hero with faststart
        run: |
          INPUT="assets/paginas/home/s1-topo-hero/290926-dia-da-amazonia-lenses-v2.mp4"
          OUTPUT="assets/paginas/home/s1-topo-hero/lenses-hero-optimized.mp4"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json "$INPUT"
          ffmpeg -hide_banner -loglevel error -y -i "$INPUT" -vf "scale=w='min(1920,iw)':h=-2:flags=lanczos,fps=30" -c:v libx264 -preset veryfast -crf 25 -maxrate 3500k -bufsize 7000k -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "$OUTPUT"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json "$OUTPUT"
          test -s "$OUTPUT"
          python3 - <<'PY'
          import os
          p="assets/paginas/home/s1-topo-hero/lenses-hero-optimized.mp4"
          b=open(p,"rb").read(2048)
          print("Optimized hero bytes:",os.stat(p).st_size)
          assert b.find(b"moov") >= 0, "MP4 faststart metadata missing"
          assert os.stat(p).st_size < 35000000, "Video still too large for hero"
          PY
      - name: Commit optimized asset to repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/paginas/home/s1-topo-hero/lenses-hero-optimized.mp4
          git commit -m "perf(home): add optimized hero MP4 for reliable playback"
          git push origin HEAD:fix/lenses-hero-bellamazon-scroll-20261109
