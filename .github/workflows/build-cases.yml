# Optional verification only: heavyweight media processing and publication
# happen locally through Antigravity /novocase after user approval.
name: Validar cases LENSES

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testar gerador
        run: node scripts/test-case-builder.mjs
      - name: Conferir cases gerados
        run: node scripts/check-generated-cases.mjs
